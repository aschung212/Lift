<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: #0c0c0c;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* Subtle gradient background */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 80% at 75% 50%, rgba(200, 168, 76, 0.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 60% at 20% 30%, rgba(200, 168, 76, 0.04) 0%, transparent 60%);
}

.left {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px 50px 60px 70px;
  position: relative;
  z-index: 1;
}

.logo-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.logo-icon {
  width: 64px;
  height: 64px;
  border-radius: 14px;
}

.logo-text {
  font-size: 56px;
  font-weight: 800;
  color: #c8a84c;
  letter-spacing: -2px;
}

.tagline {
  font-size: 28px;
  font-weight: 600;
  color: #eeeeee;
  line-height: 1.4;
  margin-bottom: 16px;
  max-width: 440px;
}

.subtitle {
  font-size: 18px;
  color: #a09878;
  line-height: 1.5;
  max-width: 400px;
}

.badges {
  display: flex;
  gap: 12px;
  margin-top: 32px;
}

.badge {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid rgba(200, 168, 76, 0.3);
  color: #c8a84c;
  background: rgba(200, 168, 76, 0.08);
}

.right {
  width: 460px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
}

.phone-frame {
  width: 260px;
  height: 540px;
  border-radius: 36px;
  border: 3px solid rgba(200, 168, 76, 0.3);
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(200,168,76,0.1);
  position: relative;
  background: #0a1210;
}

.phone-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}

/* Notch */
.phone-frame::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 28px;
  background: #0c0c0c;
  border-radius: 0 0 20px 20px;
  z-index: 2;
}
</style>
</head>
<body>
  <div class="left">
    <div class="logo-row">
      <img src="/icon-512.png" class="logo-icon" alt="">
      <span class="logo-text">Lift</span>
    </div>
    <div class="tagline">Track your sets.<br>Hit new PRs.</div>
    <div class="subtitle">Free workout tracker with estimated 1RM progress, PR targets, and 9 customizable themes.</div>
    <div class="badges">
      <span class="badge">Offline-First</span>
      <span class="badge">No Ads</span>
      <span class="badge">Open Source</span>
    </div>
  </div>
  <div class="right">
    <div class="phone-frame">
      <img src="/screenshot-detail.png" alt="Lift app screenshot">
    </div>
  </div>
</body>
</html>
