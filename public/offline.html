<!DOCTYPE html>
<html lang="en" data-theme="eternal" data-mode="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Lift — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-text-size-adjust: 100%;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 320px;
      text-align: center;
    }

    .wordmark {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.035em;
      color: #d4af37;
    }

    .icon {
      width: 48px;
      height: 48px;
      stroke: #808080;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
      color: #e0e0e0;
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      color: #808080;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      min-height: 48px;
      padding: 12px 32px;
      border: none;
      border-radius: 12px;
      background: #d4af37;
      color: #0a0a0a;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease;
    }

    .retry-btn:active {
      opacity: 0.8;
    }

    @media (prefers-color-scheme: light) {
      body { background: #f5f5f5; color: #1a1a1a; }
      h1 { color: #1a1a1a; }
      p { color: #666; }
      .icon { stroke: #666; }
      .retry-btn { color: #1a1a1a; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wordmark">Lift</div>
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <line x1="1" y1="1" x2="23" y2="23" />
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
      <line x1="12" y1="20" x2="12.01" y2="20" />
    </svg>
    <h1>You're offline</h1>
    <p>Check your connection and try again. Your workout data is saved locally and will be here when you're back.</p>
    <button class="retry-btn" onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
