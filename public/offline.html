<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Lift — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      background: #0a0a0a;
      color: #e8e8e8;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      -webkit-text-size-adjust: 100%;
    }

    .offline-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      max-width: 320px;
    }

    .offline-icon {
      width: 64px;
      height: 64px;
      color: #d4af37;
      opacity: 0.8;
    }

    .offline-wordmark {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1;
      color: #d4af37;
    }

    .offline-heading {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
      color: #e8e8e8;
    }

    .offline-body {
      font-size: 15px;
      line-height: 1.5;
      color: #888;
    }

    .offline-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 200px;
      min-height: 48px;
      padding: 12px 32px;
      border: none;
      border-radius: 12px;
      background: #d4af37;
      color: #0a0a0a;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease;
    }

    .offline-retry:active {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="offline-content">
    <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
    <div class="offline-wordmark">Lift</div>
    <h1 class="offline-heading">You're offline</h1>
    <p class="offline-body">
      Check your connection and try again.
      Your workout data is safe — it's stored locally on this device.
    </p>
    <button class="offline-retry" onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
