<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lift" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Standard -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <meta name="theme-color" content="#0f0f0f" />

  <!-- SEO -->
  <meta name="description" content="A free, open-source PWA workout tracker. Log sets, track estimated 1RM progress, visualize training history, and hit new PRs — all offline-capable." />
  <link rel="canonical" href="https://spa-rho-sandy.vercel.app" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lift — Workout Tracker" />
  <meta property="og:description" content="Log sets, track estimated 1RM progress, and hit new PRs. Free, offline-capable PWA." />
  <meta property="og:image" content="https://spa-rho-sandy.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://spa-rho-sandy.vercel.app" />
  <meta property="og:site_name" content="Lift" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lift — Workout Tracker" />
  <meta name="twitter:description" content="Log sets, track estimated 1RM progress, and hit new PRs. Free, offline-capable PWA." />
  <meta name="twitter:image" content="https://spa-rho-sandy.vercel.app/og-image.png" />

  <title>Lift — Workout Tracker</title>
</head>
<body>
  <!-- Splash screen: shows instantly before JS loads, fades out on Vue mount -->
  <div id="splash" aria-hidden="true">
    <img src="/icon-192.png" alt="" width="96" height="96" />
    <span>Lift</span>
  </div>
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: #0a0a0a;
      transition: opacity 0.3s ease;
    }
    #splash img { border-radius: 16px; }
    #splash span {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      font-size: 20px; font-weight: 600; letter-spacing: 0.02em;
      color: rgba(255,255,255,0.7);
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }
  </style>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
