<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lift" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Standard -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <meta name="theme-color" content="#0f0f0f" />

  <!-- SEO -->
  <meta name="description" content="A free, open-source PWA workout tracker. Log sets, track estimated 1RM progress, visualize training history, and hit new PRs — all offline-capable." />
  <link rel="canonical" href="https://liftracker.app" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lift — Workout Tracker" />
  <meta property="og:description" content="Log sets, track estimated 1RM progress, and hit new PRs. Free, offline-capable PWA." />
  <meta property="og:image" content="https://liftracker.app/icon-512.png" />
  <meta property="og:url" content="https://liftracker.app" />
  <meta property="og:site_name" content="Lift" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Lift — Workout Tracker" />
  <meta name="twitter:description" content="Log sets, track estimated 1RM progress, and hit new PRs. Free, offline-capable PWA." />
  <meta name="twitter:image" content="https://liftracker.app/icon-512.png" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Lift",
    "description": "A free, open-source PWA workout tracker. Log sets, track estimated 1RM progress, visualize training history, and hit new PRs — all offline-capable.",
    "applicationCategory": "SportsApplication",
    "operatingSystem": "All",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "url": "https://spa-rho-sandy.vercel.app",
    "image": "https://spa-rho-sandy.vercel.app/icon-512.png",
    "author": {
      "@type": "Person",
      "name": "Aaron Chung"
    }
  }
  </script>

  <title>Lift — Workout Tracker</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
