name: Integration Tests

on:
  schedule:
    # Run nightly at 06:00 UTC (11 PM PT)
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-integration:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v5.0.5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Extract Supabase credentials
        id: supabase
        run: |
          echo "url=http://127.0.0.1:54321" >> "$GITHUB_OUTPUT"
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY // .service_role_key')
          echo "service_role_key=$SERVICE_ROLE_KEY" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        env:
          SUPABASE_INT_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_INT_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
        run: npx vitest run --config vitest.integration.config.js

      - name: Stop local Supabase
        if: always()
        run: supabase stop
