name: Integration Tests

on:
  schedule:
    # Run nightly at 06:00 UTC (11 PM PT)
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# Force GitHub-hosted JS actions onto the Node 24 runtime, declared once for the
# whole workflow so a new job can't silently omit it and drift back to an older Node.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v2
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Extract Supabase credentials
        id: supabase
        run: |
          echo "url=http://127.0.0.1:54321" >> "$GITHUB_OUTPUT"
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY // .service_role_key')
          echo "service_role_key=$SERVICE_ROLE_KEY" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        env:
          SUPABASE_INT_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_INT_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
        run: npx vitest run --config vitest.integration.config.js

      - name: Stop local Supabase
        if: always()
        run: supabase stop
