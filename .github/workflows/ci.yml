name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck

  build-and-test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: ${{ github.event_name == 'push' && 7 || 3 }}

      - name: Generate bundle size data
        run: node scripts/bundle-sizes.js bundle-sizes.json

      - name: Check bundle size budget
        run: |
          # Total JS bundle budget: 500 KB (currently ~410 KB)
          TOTAL_JS=$(node -e "const d=JSON.parse(require('fs').readFileSync('bundle-sizes.json','utf8')); console.log(d.total)")
          BUDGET=512000
          echo "JS bundle size: $(( TOTAL_JS / 1024 )) KB (budget: $(( BUDGET / 1024 )) KB)"
          if [ "$TOTAL_JS" -gt "$BUDGET" ]; then
            echo "::error::Bundle size ($((TOTAL_JS / 1024)) KB) exceeds budget ($((BUDGET / 1024)) KB)"
            exit 1
          fi

      - name: Save baseline bundle sizes (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: bundle-sizes.json
          key: bundle-sizes-master-${{ github.sha }}

      - name: Stash PR bundle sizes before restoring baseline
        if: github.event_name == 'pull_request'
        run: cp bundle-sizes.json pr-bundle-sizes.json

      - name: Restore baseline bundle sizes (PRs only)
        if: github.event_name == 'pull_request'
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: bundle-sizes.json
          key: bundle-sizes-master-${{ github.event.pull_request.base.sha }}
          restore-keys: bundle-sizes-master-

      - name: Post bundle size delta comment (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = JSON.parse(fs.readFileSync('pr-bundle-sizes.json', 'utf8'));

            // Try to load baseline — cache restore overwrites bundle-sizes.json
            let base = null;
            const cacheHit = '${{ steps.baseline.outputs.cache-hit }}' === 'true';
            if (cacheHit) {
              try {
                base = JSON.parse(fs.readFileSync('bundle-sizes.json', 'utf8'));
              } catch {
                // Corrupted cache — proceed without baseline
              }
            }

            const kb = (b) => (b / 1024).toFixed(1);
            const delta = (a, b) => {
              const d = a - b;
              const sign = d > 0 ? '+' : '';
              return `${sign}${kb(d)} KB`;
            };

            const BUDGET = 512000;
            let body = `## 📦 Bundle Size Report\n\n`;

            if (base) {
              // Build comparison table
              const allChunks = new Set([...Object.keys(pr.chunks), ...Object.keys(base.chunks)]);
              const rows = [];
              for (const name of [...allChunks].sort()) {
                const prSize = pr.chunks[name] || 0;
                const baseSize = base.chunks[name] || 0;
                const diff = prSize - baseSize;
                if (diff === 0) continue; // skip unchanged chunks
                const icon = diff > 0 ? '🔺' : '🔽';
                rows.push(`| ${name} | ${kb(baseSize)} KB | ${kb(prSize)} KB | ${icon} ${delta(prSize, baseSize)} |`);
              }

              const totalDiff = pr.total - base.total;
              const totalIcon = totalDiff > 0 ? '🔺' : totalDiff < 0 ? '🔽' : '➡️';
              const pct = base.total > 0 ? ((totalDiff / base.total) * 100).toFixed(1) : '0.0';

              body += `| Chunk | Base | PR | Delta |\n`;
              body += `|-------|-----:|---:|------:|\n`;

              if (rows.length > 0) {
                body += rows.join('\n') + '\n';
              } else {
                body += `| _(no changes)_ | | | |\n`;
              }

              body += `| **Total** | **${kb(base.total)} KB** | **${kb(pr.total)} KB** | **${totalIcon} ${delta(pr.total, base.total)} (${pct}%)** |\n\n`;
              body += `Budget: ${kb(pr.total)} / ${kb(BUDGET)} KB (${((pr.total / BUDGET) * 100).toFixed(0)}% used)\n`;
            } else {
              // No baseline available — just show current sizes
              body += `| Chunk | Size |\n`;
              body += `|-------|-----:|\n`;
              for (const [name, size] of Object.entries(pr.chunks).sort((a, b) => b[1] - a[1])) {
                body += `| ${name} | ${kb(size)} KB |\n`;
              }
              body += `| **Total** | **${kb(pr.total)} KB** |\n\n`;
              body += `Budget: ${kb(pr.total)} / ${kb(BUDGET)} KB (${((pr.total / BUDGET) * 100).toFixed(0)}% used)\n`;
              body += `\n_No baseline from master yet — delta will appear after the next master build._\n`;
            }

            // Find and update existing comment or create new one
            const MARKER = '<!-- bundle-size-report -->';
            body = MARKER + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - run: npx vitest run --coverage

      - name: Coverage report
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Build-time flag: makes the dev sign-in button available in the
      # production bundle so e2e tests can authenticate without Supabase.
      # Real Vercel deploys do not set this, so the button stays hidden.
      VITE_E2E: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Push unapplied Supabase migrations on merge to master.
  # Runs before Vercel deploys so the DB schema is ready for the new code.
  migrate-db:
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Notify Slack on post-merge success (push to master only).
  # SECURITY: commit message + URL come in via env var, NOT direct
  # `${{ ... }}` interpolation into the bash body. Inline interpolation
  # is a known GitHub Actions script-injection vector — any commit
  # containing single quotes, parentheses, backticks, or `$(...)`
  # would break the run step (and could execute attacker-controlled
  # shell). See GitHub docs: "Understanding the risk of script injections".
  notify-deploy:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build-and-test, e2e, migrate-db]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -1)
          MSG="✅ *Deployed to production*\nCommit: <${COMMIT_URL}|${COMMIT_MSG}>"
          payload=$(printf '{"text": %s}' "$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload"

  # Notify Slack on post-merge failure (push to master only). Same
  # script-injection guard as `notify-deploy` above.
  notify-failure:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build-and-test, e2e, migrate-db]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -1)
          MSG="🔴 *Post-merge CI failed on master*\nCommit: <${COMMIT_URL}|${COMMIT_MSG}>\nRun: <${RUN_URL}|View logs>"
          payload=$(printf '{"text": %s}' "$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload"
