name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege: no permissions by default. Each job grants only what it needs.
# See: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck

  build-and-test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    permissions:
      contents: read
      pull-requests: write  # coverage report comments on PRs
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: ${{ github.event_name == 'push' && 7 || 3 }}

      - name: Check bundle size budget
        run: |
          # Total JS bundle budget: 500 KB (currently ~410 KB)
          TOTAL_JS=$(find dist/assets -name '*.js' ! -name 'workbox-*' ! -name 'sw.*' -exec wc -c {} + | tail -1 | awk '{print $1}')
          BUDGET=512000
          echo "JS bundle size: $(( TOTAL_JS / 1024 )) KB (budget: $(( BUDGET / 1024 )) KB)"
          if [ "$TOTAL_JS" -gt "$BUDGET" ]; then
            echo "::error::Bundle size ($((TOTAL_JS / 1024)) KB) exceeds budget ($((BUDGET / 1024)) KB)"
            exit 1
          fi

      - run: npx vitest run --coverage

      - name: Coverage report
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Build-time flag: makes the dev sign-in button available in the
      # production bundle so e2e tests can authenticate without Supabase.
      # Real Vercel deploys do not set this, so the button stays hidden.
      VITE_E2E: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Push unapplied Supabase migrations on merge to master.
  # Runs before Vercel deploys so the DB schema is ready for the new code.
  migrate-db:
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e]
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: supabase/setup-cli@df56b21da46c98abb12a9804e4fb1f657773e333 # v2
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Notify Slack on post-merge success (push to master only).
  # SECURITY: commit message + URL come in via env var, NOT direct
  # `${{ ... }}` interpolation into the bash body. Inline interpolation
  # is a known GitHub Actions script-injection vector — any commit
  # containing single quotes, parentheses, backticks, or `$(...)`
  # would break the run step (and could execute attacker-controlled
  # shell). See GitHub docs: "Understanding the risk of script injections".
  notify-deploy:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build-and-test, e2e, migrate-db]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -1)
          MSG="✅ *Deployed to production*\nCommit: <${COMMIT_URL}|${COMMIT_MSG}>"
          payload=$(printf '{"text": %s}' "$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload"

  # Notify Slack on post-merge failure (push to master only). Same
  # script-injection guard as `notify-deploy` above.
  notify-failure:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build-and-test, e2e, migrate-db]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -1)
          MSG="🔴 *Post-merge CI failed on master*\nCommit: <${COMMIT_URL}|${COMMIT_MSG}>\nRun: <${RUN_URL}|View logs>"
          payload=$(printf '{"text": %s}' "$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload"
