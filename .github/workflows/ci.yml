name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Check bundle size budget
        run: |
          # Total JS bundle budget: 500 KB (currently ~410 KB)
          TOTAL_JS=$(find dist/assets -name '*.js' ! -name 'workbox-*' ! -name 'sw.*' -exec wc -c {} + | tail -1 | awk '{print $1}')
          BUDGET=512000
          echo "JS bundle size: $(( TOTAL_JS / 1024 )) KB (budget: $(( BUDGET / 1024 )) KB)"
          if [ "$TOTAL_JS" -gt "$BUDGET" ]; then
            echo "::error::Bundle size ($((TOTAL_JS / 1024)) KB) exceeds budget ($((BUDGET / 1024)) KB)"
            exit 1
          fi

      - run: npx vitest run --coverage

  # Notify Slack on post-merge success (push to master only)
  notify-deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_URL="${{ github.event.head_commit.url }}"
          MSG="✅ *Deployed to production*\nCommit: <${COMMIT_URL}|${COMMIT_MSG}>"
          payload=$(printf '{"text": %s}' "$(echo "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload"

  # Notify Slack on post-merge failure (push to master only)
  notify-failure:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_URL="${{ github.event.head_commit.url }}"
          MSG="🔴 *Post-merge CI failed on master*\nCommit: <${COMMIT_URL}|${COMMIT_MSG}>\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
          payload=$(printf '{"text": %s}' "$(echo "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload"
