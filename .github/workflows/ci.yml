name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

  lint:
    runs-on: ubuntu-latest
    needs: install
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: install
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm run typecheck

  build-and-test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    permissions:
      contents: read
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: ${{ github.event_name == 'push' && 7 || 3 }}

      - name: Restore base bundle sizes (PR)
        if: github.event_name == 'pull_request'
        id: base-bundle
        uses: actions/cache/restore@v4
        with:
          path: bundle-sizes.json
          key: bundle-sizes-master-${{ github.event.pull_request.base.sha }}
          restore-keys: bundle-sizes-master-

      - name: Preserve base bundle sizes
        if: github.event_name == 'pull_request'
        run: if [ -f bundle-sizes.json ]; then mv bundle-sizes.json base-bundle-sizes.json; fi

      - name: Measure bundle sizes
        id: bundle
        run: |
          # Total JS bundle budget: 500 KB (currently ~410 KB)
          TOTAL_JS=$(find dist/assets -name '*.js' ! -name 'workbox-*' ! -name 'sw.*' -exec wc -c {} + | tail -1 | awk '{print $1}')
          TOTAL_CSS=$(find dist/assets -name '*.css' -exec wc -c {} + | tail -1 | awk '{print $1}')
          TOTAL_CSS=${TOTAL_CSS:-0}
          BUDGET=512000

          echo "js_bytes=$TOTAL_JS" >> "$GITHUB_OUTPUT"
          echo "css_bytes=$TOTAL_CSS" >> "$GITHUB_OUTPUT"
          echo "JS bundle size: $(( TOTAL_JS / 1024 )) KB (budget: $(( BUDGET / 1024 )) KB)"
          echo "CSS bundle size: $(( TOTAL_CSS / 1024 )) KB"

          if [ "$TOTAL_JS" -gt "$BUDGET" ]; then
            echo "::error::Bundle size ($((TOTAL_JS / 1024)) KB) exceeds budget ($((BUDGET / 1024)) KB)"
            exit 1
          fi

          # Save sizes for cross-build comparison
          echo "{\"js\": $TOTAL_JS, \"css\": $TOTAL_CSS}" > bundle-sizes.json

      - name: Save bundle sizes (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: bundle-sizes.json
          key: bundle-sizes-master-${{ github.sha }}

      - name: Post bundle size delta comment
        if: always() && github.event_name == 'pull_request' && steps.bundle.outputs.js_bytes
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const jsBytes = parseInt('${{ steps.bundle.outputs.js_bytes }}', 10);
            const cssBytes = parseInt('${{ steps.bundle.outputs.css_bytes }}', 10);
            const budget = 512000;

            let body = '## 📦 Bundle Size Report\n\n';

            // Try to load base branch sizes
            let baseJs = null, baseCss = null;
            try {
              const base = JSON.parse(fs.readFileSync('base-bundle-sizes.json', 'utf8'));
              baseJs = base.js;
              baseCss = base.css;
            } catch {
              // No cached baseline — first run or cache expired
            }

            const fmt = (bytes) => `${(bytes / 1024).toFixed(1)} KB`;
            const delta = (cur, prev) => {
              const diff = cur - prev;
              const sign = diff > 0 ? '+' : '';
              const icon = diff > 0 ? '🔺' : diff < 0 ? '🔽' : '✅';
              return `${icon} ${sign}${fmt(diff)}`;
            };

            body += '| Asset | Size | Budget | Delta |\n';
            body += '|-------|------|--------|-------|\n';

            const jsDelta = baseJs != null ? delta(jsBytes, baseJs) : '—';
            const cssDelta = baseCss != null ? delta(cssBytes, baseCss) : '—';
            const jsPct = ((jsBytes / budget) * 100).toFixed(0);

            body += `| JS | ${fmt(jsBytes)} | ${fmt(budget)} (${jsPct}%) | ${jsDelta} |\n`;
            body += `| CSS | ${fmt(cssBytes)} | — | ${cssDelta} |\n`;

            if (baseJs == null) {
              body += '\n> _No baseline from master yet. Delta will appear after the next master build._\n';
            }

            // Upsert: find existing comment by marker, update or create
            const marker = '<!-- bundle-size-report -->';
            body = marker + '\n' + body;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existing = comments.find(c => c.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              // Fork PRs have read-only tokens — log but don't fail the build
              core.warning(`Could not post bundle size comment: ${err.message}`);
            }

      - run: npx vitest run --coverage

      - name: Coverage report
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Build-time flag: makes the dev sign-in button available in the
      # production bundle so e2e tests can authenticate without Supabase.
      # Real Vercel deploys do not set this, so the button stays hidden.
      VITE_E2E: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Push unapplied Supabase migrations on merge to master.
  # Runs before Vercel deploys so the DB schema is ready for the new code.
  migrate-db:
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Notify Slack on post-merge success (push to master only).
  # SECURITY: commit message + URL come in via env var, NOT direct
  # `${{ ... }}` interpolation into the bash body. Inline interpolation
  # is a known GitHub Actions script-injection vector — any commit
  # containing single quotes, parentheses, backticks, or `$(...)`
  # would break the run step (and could execute attacker-controlled
  # shell). See GitHub docs: "Understanding the risk of script injections".
  notify-deploy:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build-and-test, e2e, migrate-db]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -1)
          MSG="✅ *Deployed to production*\nCommit: <${COMMIT_URL}|${COMMIT_MSG}>"
          payload=$(printf '{"text": %s}' "$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload"

  # Notify Slack on post-merge failure (push to master only). Same
  # script-injection guard as `notify-deploy` above.
  notify-failure:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build-and-test, e2e, migrate-db]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -1)
          MSG="🔴 *Post-merge CI failed on master*\nCommit: <${COMMIT_URL}|${COMMIT_MSG}>\nRun: <${RUN_URL}|View logs>"
          payload=$(printf '{"text": %s}' "$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload"
